<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scheduled Sits Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F5F0;
    --card:#FFFDFA;
    --ink:#1F1E1C;
    --muted:#6E6A62;
    --faint:#A7A196;
    --line:#E6E1D6;
    --line-bold:#C4BCA8;   /* day borders read as drawn rules, not hairlines */
    --accent:#3F6C9E;
    --accent-soft:#EAF1F8;

    /* Day shading by volume: light orange for 1–2, bright orange for 3+. */
    --lo-cell:#FDE6C9;   --lo-ink:#6B3B06;
    --hi-cell:#F79433;   --hi-ink:#48280A;

    --radius:10px;
    --shadow:0 1px 2px rgba(31,30,28,0.05), 0 1px 8px rgba(31,30,28,0.04);
    --shadow-lift:0 2px 6px rgba(31,30,28,0.09), 0 8px 20px rgba(31,30,28,0.07);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:26px 22px 44px;
    min-height:100vh;
  }
  .wrap{max-width:1220px;margin:0 auto;}

  /* ── Masthead ───────────────────────────────────────────────── */
  .masthead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:18px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 5px;
  }
  .masthead h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:clamp(27px,3.2vw,38px);
    margin:0;
    line-height:1;
    letter-spacing:-0.015em;
  }

  /* Month switcher reads as one control rather than three loose pieces. */
  .nav{
    display:flex;
    align-items:center;
    gap:2px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    box-shadow:var(--shadow);
  }
  .nav button{
    width:32px;height:32px;
    display:grid;place-items:center;
    border:none;
    border-radius:50%;
    background:transparent;
    color:var(--muted);
    font-size:17px;
    line-height:1;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .nav button:hover{background:var(--accent-soft);color:var(--accent);}
  .nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .month-label{
    min-width:158px;
    text-align:center;
    font-weight:600;
    font-size:14px;
    letter-spacing:.01em;
  }
  .month-label .yr{color:var(--faint);font-weight:500;margin-left:5px;}

  /* ── Stats + legend strip ───────────────────────────────────── */
  .strip{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px 22px;
    padding:11px 15px;
    margin-bottom:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .stat{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--muted);}
  .stat b{
    font-family:'Fraunces',Georgia,serif;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    line-height:1;
  }
  .strip .sep{width:1px;align-self:stretch;background:var(--line);}
  .legend{
    display:flex;align-items:center;gap:14px;
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--faint);
    flex-wrap:wrap;
  }
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{
    width:16px;height:15px;border-radius:5px;
    display:inline-block;font-style:normal;
  }

  /* ── Calendar ───────────────────────────────────────────────── */
  .dow-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
    margin-bottom:7px;
  }
  .dow{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--faint);
    padding:2px 0 4px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
  }

  /* Cells are cards now. The old version filled whole days with sage/ochre,
     which made "how many" the loudest thing on the page and clashed with the
     rep colours; volume moved to the small pill in the corner instead. */
  .cell{
    position:relative;
    min-height:126px;
    padding:8px 9px 10px;
    background:var(--card);
    border:2px solid var(--line-bold);
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    gap:5px;
    transition:box-shadow .16s, transform .16s, border-color .16s;
  }
  .cell.has-sits:hover{
    box-shadow:var(--shadow-lift);
    transform:translateY(-1px);
    border-color:#9E957F;
    z-index:2;
  }
  .cell.weekend{background:#F1EEE6;}
  .cell.outside{background:transparent;border-color:transparent;}
  .cell.outside .daynum{color:#CFC9BC;}
  /* Days already gone stay readable but recede. */
  .cell.past{opacity:.62;}

  /* Volume shading. Written after .weekend so a busy Saturday still reads
     as busy rather than as a weekend. */
  .cell.lvl-lo{background:var(--lo-cell);border-color:#EDBE84;}
  .cell.lvl-hi{background:var(--hi-cell);border-color:#D2761A;}
  /* Day numbers stay --ink on both tints: near-black already has more contrast
     on pale green and lime than a green would, so no override is needed. */
  .cell.lvl-lo .entry a{color:var(--lo-ink);}
  .cell.lvl-hi .entry a{color:var(--hi-ink);}
  .cell.lvl-lo .entry .t,
  .cell.lvl-hi .entry .t{color:rgba(58,30,2,0.62);}
  .cell.lvl-lo .more,
  .cell.lvl-hi .more{color:rgba(58,30,2,0.68);}

  .cell-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    min-height:20px;
  }
  .daynum{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:12.5px;
    color:var(--muted);
  }
  .cell.has-sits .daynum{color:var(--ink);}

  /* Today gets the only filled badge on the page, so it is findable instantly. */
  .cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .cell.today .daynum{
    background:var(--accent);
    color:#fff;
    border-radius:50%;
    width:21px;height:21px;
    display:grid;place-items:center;
    margin:-1px 0 -1px -2px;
  }

  .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:500;
    line-height:1;
    padding:3px 6px;
    border-radius:999px;
  }
  /* Sits on a tinted day, so it needs its own light ground to stay readable. */
  .count.lo{background:rgba(255,255,255,0.78);color:var(--lo-ink);}
  .count.hi{background:rgba(255,255,255,0.75);color:var(--hi-ink);}

  .entries{display:flex;flex-direction:column;gap:4px;}

  .entry{
    display:flex;
    gap:6px;
    font-size:11.5px;
    line-height:1.35;
  }
  .entry .t{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--faint);
    white-space:nowrap;
    padding-top:1.5px;
    min-width:31px;
  }
  .entry .body{flex:1;min-width:0;}
  .entry a{
    color:var(--ink);
    text-decoration:none;
    font-weight:500;
    border-bottom:1px solid transparent;
    transition:color .12s, border-color .12s;
  }
  .entry a:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .entry a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px;}

  /* Rep chip. A light ground rather than a tint of the rep's own colour,
     because the chip now sits on cream, pale green or lime depending on how
     busy the day is, and a coloured tint muddied against the darker limes. */
  .chip{
    display:inline-block;
    font-size:9.5px;
    font-weight:600;
    line-height:1.5;
    letter-spacing:.01em;
    padding:0 5px;
    margin-left:5px;
    border-radius:999px;
    border:1px solid;
    background:rgba(255,255,255,0.82);
    white-space:nowrap;
    vertical-align:1px;
  }

  .more{
    margin-top:auto;
    padding-top:2px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--faint);
    font-weight:500;
  }
  .cell.lvl-lo .more, .cell.lvl-hi .more{text-decoration:underline;text-underline-offset:2px;}

  /* Any day with sits opens the day sheet. */
  .cell.clickable{cursor:pointer;}
  .cell.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ── Day sheet ──────────────────────────────────────────────── */
  .backdrop{
    position:fixed;
    inset:0;
    background:rgba(31,30,28,0.38);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    z-index:50;
  }
  .backdrop[hidden]{display:none;}
  .sheet{
    background:var(--card);
    border:2px solid var(--line-bold);
    border-radius:14px;
    box-shadow:0 12px 40px rgba(31,30,28,0.22);
    width:min(520px,100%);
    max-height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .sheet-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:16px 18px 13px;
    border-bottom:1px solid var(--line);
  }
  .sheet-head h2{
    font-family:'Fraunces',Georgia,serif;
    font-size:21px;
    font-weight:600;
    margin:0;
    line-height:1.15;
  }
  .sheet-head .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--faint);
    margin-top:3px;
  }
  .sheet-close{
    flex:none;
    width:30px;height:30px;
    border:1px solid var(--line);
    border-radius:50%;
    background:transparent;
    color:var(--muted);
    font-size:17px;
    line-height:1;
    cursor:pointer;
  }
  .sheet-close:hover{background:var(--accent-soft);color:var(--accent);}
  .sheet-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .sheet-body{overflow-y:auto;padding:6px 0;}
  .sit{
    display:flex;
    gap:12px;
    padding:11px 18px;
    border-bottom:1px solid #F0EDE4;
  }
  .sit:last-child{border-bottom:none;}
  .sit .when{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    min-width:56px;
    padding-top:2px;
    white-space:nowrap;
  }
  .sit .who{flex:1;min-width:0;}
  .sit .who a{
    color:var(--ink);
    font-weight:600;
    font-size:13.5px;
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .sit .who a:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .sit .who a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px;}
  .sit .meta{
    margin-top:3px;
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }
  .sit .meta .dot{color:var(--faint);}

  /* ── States ─────────────────────────────────────────────────── */
  .status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    padding:28px 2px;
  }
  .status.error{color:#8A2F2F;}

  footer{
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--faint);
  }

  @media (prefers-reduced-motion: reduce){
    .cell, .nav button, .entry a{transition:none;}
    .cell.has-sits:hover{transform:none;}
  }

  /* Below ~760px seven columns cannot hold a name and a chip, so let the
     calendar scroll sideways rather than crushing every cell. */
  @media (max-width:760px){
    body{padding:18px 14px 32px;}
    .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
    .dow-row, .grid{min-width:680px;}
    .cell{min-height:112px;}
    .legend{margin-left:0;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <p class="eyebrow">Peachtree Roofing &amp; Exteriors</p>
      <h1>Scheduled Sits</h1>
    </div>
    <div class="nav">
      <button id="prevBtn" aria-label="Previous month">&#8249;</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextBtn" aria-label="Next month">&#8250;</button>
    </div>
  </div>

  <div class="strip" id="strip" style="display:none;">
    <div class="stat"><b id="statTotal">0</b> <span id="statTotalLabel">sits</span></div>
    <div class="sep"></div>
    <div class="stat">busiest <b id="statBusy">—</b></div>
    <div class="sep"></div>
    <div class="stat"><b id="statReps">0</b> reps out</div>
    <div class="legend">
      <span><i style="background:var(--lo-cell);border:1px solid #EDBE84"></i>1&ndash;2</span>
      <span><i style="background:var(--hi-cell);border:1px solid #D2761A"></i>3+</span>
      <span>click a name to open in AcuLynx</span>
    </div>
  </div>

  <div class="status" id="status">Loading appointments&hellip;</div>

  <div id="calendarWrap" style="display:none;">
    <div class="scroller">
      <div class="dow-row">
        <div class="dow">Sun</div><div class="dow">Mon</div><div class="dow">Tue</div>
        <div class="dow">Wed</div><div class="dow">Thu</div><div class="dow">Fri</div>
        <div class="dow">Sat</div>
      </div>
      <div class="grid" id="calendarGrid"></div>
    </div>
  </div>

  <div class="backdrop" id="dayBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <div>
          <h2 id="sheetTitle"></h2>
          <div class="sub" id="sheetSub"></div>
        </div>
        <button class="sheet-close" id="sheetClose" aria-label="Close">&times;</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <footer>
    <span id="countFooter"></span>
    <span>Data source: appointments.csv &mdash; drop in a fresh AcuLynx export to refresh</span>
  </footer>

</div>

<script>
/* ============================================================
   Scheduled Sits calendar.

   Reads appointments.csv next to this file -- the AcuLynx "Scheduled Sits"
   export, used exactly as downloaded. To refresh the calendar, replace
   that one file; nothing here needs editing.

   Expected columns (looked up by header name, so column order may change):
     Current Milestone | Job Name | Scheduled Sit Date | Current Status
     Company Representative | Job Name Url
   Scheduled Sit Date arrives as a single value like "7/27/26 2:00 PM".
   ============================================================ */

const grid = document.getElementById('calendarGrid');
const calendarWrap = document.getElementById('calendarWrap');
const monthLabel = document.getElementById('monthLabel');
const countFooter = document.getElementById('countFooter');
const statusEl = document.getElementById('status');
const stripEl = document.getElementById('strip');

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// How many sits a day cell shows before the rest move into the day sheet.
const CELL_LIMIT = 4;

let byDate = {};
let current = null;
let repLabels = {};
let repColors = {};

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

/* "9:00 AM" -> 540. Sorting the raw time strings compares the hour digits
   before ever reaching AM/PM, so "02:00 PM" sorts ahead of "12:00 PM" and
   afternoon sits jump above the morning ones. Compare minutes instead. */
function toMinutes(time){
  const m = /^(\d{1,2}):(\d{2})\s*([AaPp])/.exec(String(time).trim());
  if (!m) return 0;
  const hour = (Number(m[1]) % 12) + (m[3].toLowerCase() === 'p' ? 12 : 0);
  return hour * 60 + Number(m[2]);
}

/* "02:00 PM" -> "2p", "04:30 PM" -> "4:30p". The old "02:00PM" ate a third of
   the cell width; dropping the padding and the :00 leaves room for the job
   name and rep chip to sit on one line. */
function shortTime(time){
  const m = /^(\d{1,2}):(\d{2})\s*([AaPp])/.exec(String(time).trim());
  if (!m) return String(time || '');
  const hour = Number(m[1]) % 12 || 12;
  const mer = m[3].toLowerCase();
  return m[2] === '00' ? hour + mer : hour + ':' + m[2] + mer;
}

function tint(hex, alpha){
  const h = String(hex).replace('#','');
  if (h.length !== 6) return 'rgba(110,106,98,' + alpha + ')';
  return 'rgba(' + parseInt(h.substr(0,2),16) + ',' + parseInt(h.substr(2,2),16) +
         ',' + parseInt(h.substr(4,2),16) + ',' + alpha + ')';
}

/* ── COMPANY REP CHIPS ───────────────────────────────────────────────
   The export carries full names ("Dan Sinnott"); the chip shows the name
   the team actually uses. Everyone is first-name-only unless listed here.

   Edit these two lists when the roster changes -- nothing else. */

// Reps who go by something other than their first name.
const REP_NICKNAMES = {
  'Kenneth': 'Kenny',
  'Cameron': 'Cam'
};

// First names shared by more than one rep, so the chip always carries a last
// initial ("Tim B", "Tim J"). Listed explicitly rather than detected from the
// data, because a given export may contain only one of them -- Tim J is absent
// from the 8/4 export, and he must still not collide with Tim B tomorrow.
const REP_SHARED_FIRST_NAMES = ['Tim'];

// Distinct hues, dark enough to stay legible as chip text on a soft tint.
const REP_COLORS = [
  '#3F6C9E', '#2E6B4F', '#8A4B2F', '#6B3F7A', '#1F5F6B', '#7A5C2E',
  '#8A2F4F', '#40548A', '#4F6B2E', '#6B4A2F', '#2F5F8A', '#5F3F6B'
];

/* "Dan Sinnott" -> "Dan"; "Kenneth Gutzler" -> "Kenny"; "Tim Bresko" -> "Tim B".
   Falls back to a last initial for any first name that turns out to be shared
   within the loaded data, so a new duplicate is disambiguated automatically
   even before anyone updates REP_SHARED_FIRST_NAMES. */
function buildRepLabels(appointments){
  const names = [];
  appointments.forEach(a => { if (a.rep && names.indexOf(a.rep) === -1) names.push(a.rep); });

  const parsed = {};
  names.forEach(n => {
    const bits = n.split(/\s+/).filter(Boolean);
    const first = bits[0] || n;
    parsed[n] = {
      raw: first,
      display: REP_NICKNAMES[first] || first,
      lastInitial: bits.length > 1 ? bits[bits.length - 1].charAt(0).toUpperCase() : ''
    };
  });

  // Which display names are claimed by more than one person in this export?
  const seen = {};
  names.forEach(n => {
    const d = parsed[n].display;
    seen[d] = (seen[d] || 0) + 1;
  });

  const labels = {};
  names.forEach(n => {
    const p = parsed[n];
    const needsInitial = REP_SHARED_FIRST_NAMES.indexOf(p.raw) !== -1 || seen[p.display] > 1;
    labels[n] = (needsInitial && p.lastInitial) ? p.display + ' ' + p.lastInitial : p.display;
  });
  return labels;
}

/* One colour per rep, assigned without anyone maintaining a list.

   The hue starts from a hash of the name so a given rep keeps the same colour
   from export to export, then probes forward to the next free slot -- hashing
   alone collided three times across eleven reps, which defeats the point of
   colouring them. Reps beyond REP_COLORS.length will start to share hues. */
function buildRepColors(names){
  const used = {};
  const out = {};
  names.slice().sort().forEach(name => {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    let idx = h % REP_COLORS.length;
    for (let k = 0; k < REP_COLORS.length; k++) {
      const cand = (idx + k) % REP_COLORS.length;
      if (!used[cand]) { idx = cand; break; }
    }
    used[idx] = true;
    out[name] = REP_COLORS[idx];
  });
  return out;
}

/* Minimal CSV reader: handles quoted fields, embedded commas and newlines,
   and "" escapes -- a job name like "Smith, John" must not split a row. */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\n') {
      row.push(field); rows.push(row); row = []; field = '';
    } else if (c !== '\r') {
      field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }

  // Drop trailing blank lines the export leaves behind
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

/* "7/27/26 2:00 PM" -> { date: "2026-07-27", time: "02:00 PM" }. */
function parseSitDateTime(raw){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(\d{1,2}):(\d{2})\s*([AaPp])[Mm]?\.?$/.exec(String(raw).trim());
  if (!m) return null;
  let year = Number(m[3]);
  if (year < 100) year += 2000;
  return {
    date: year + '-' + pad(Number(m[1])) + '-' + pad(Number(m[2])),
    time: pad(Number(m[4])) + ':' + m[5] + ' ' + m[6].toUpperCase() + 'M'
  };
}

/* Map the AcuLynx export rows onto the records the calendar renders.
   Columns are located by header name so a reordered export still works. */
function rowsToAppointments(rows){
  if (!rows.length) throw new Error('appointments.csv is empty');

  const header = rows[0].map(h => h.trim().toLowerCase());
  const col = name => header.indexOf(name);
  const iDate = col('scheduled sit date');
  const iName = col('job name');
  const iUrl  = col('job name url');
  const iMile = col('current milestone');
  const iStat = col('current status');
  const iRep  = col('company representative');  // added Aug 2026; older exports lack it

  if (iDate === -1 || iName === -1) {
    throw new Error('appointments.csv is missing a "Scheduled Sit Date" or "Job Name" column');
  }

  const appointments = [];
  const skipped = [];

  rows.slice(1).forEach((r, idx) => {
    const when = parseSitDateTime(r[iDate] || '');
    if (!when) {
      skipped.push('row ' + (idx + 2) + ': ' + (r[iDate] || '(blank date)'));
      return;
    }
    appointments.push({
      date: when.date,
      time: when.time,
      jobName: (r[iName] || '').trim(),
      milestone: iMile === -1 ? '' : (r[iMile] || '').trim(),
      status: iStat === -1 ? '' : (r[iStat] || '').trim(),
      rep: iRep === -1 ? '' : (r[iRep] || '').trim(),
      url: iUrl === -1 ? '' : (r[iUrl] || '').trim()
    });
  });

  return { appointments, skipped };
}

function render(){
  grid.innerHTML = '';

  const year = current.getFullYear();
  const month = current.getMonth();
  const startOffset = new Date(year, month, 1).getDay();
  const gridStart = new Date(year, month, 1 - startOffset);
  const todayKey = toKey(new Date());

  let totalThisMonth = 0;
  let busyKey = null, busyCount = 0;
  const repsThisMonth = {};

  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate() + i);
    const key = toKey(cellDate);
    const inMonth = cellDate.getMonth() === month;
    const entries = inMonth
      ? (byDate[key] || []).slice().sort((a,b) => toMinutes(a.time) - toMinutes(b.time))
      : [];

    const cell = document.createElement('div');
    const cls = ['cell'];
    if (!inMonth) cls.push('outside');
    else {
      const dow = cellDate.getDay();
      if (dow === 0 || dow === 6) cls.push('weekend');
      if (key === todayKey) cls.push('today');
      else if (key < todayKey) cls.push('past');
      if (entries.length) cls.push('has-sits', entries.length >= 3 ? 'lvl-hi' : 'lvl-lo');
    }
    cell.className = cls.join(' ');

    const top = document.createElement('div');
    top.className = 'cell-top';
    const num = document.createElement('span');
    num.className = 'daynum';
    num.textContent = cellDate.getDate();
    top.appendChild(num);

    if (entries.length) {
      const count = document.createElement('span');
      count.className = 'count ' + (entries.length >= 3 ? 'hi' : 'lo');
      count.textContent = entries.length;
      count.title = entries.length + (entries.length === 1 ? ' sit' : ' sits');
      top.appendChild(count);
    }
    cell.appendChild(top);

    if (entries.length) {
      totalThisMonth += entries.length;
      if (entries.length > busyCount) { busyCount = entries.length; busyKey = cellDate; }
      entries.forEach(e => { if (e.rep) repsThisMonth[e.rep] = true; });

      const list = document.createElement('div');
      list.className = 'entries';

      entries.slice(0, CELL_LIMIT).forEach(e => {
        const row = document.createElement('div');
        row.className = 'entry';

        const t = document.createElement('span');
        t.className = 't';
        t.textContent = shortTime(e.time);

        const body = document.createElement('span');
        body.className = 'body';

        const a = document.createElement('a');
        a.href = e.url || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = e.jobName || '(unnamed job)';
        a.title = [e.jobName, e.milestone, e.status].filter(Boolean).join(' — ');
        body.appendChild(a);

        if (e.rep) {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = repLabels[e.rep] || e.rep;
          const c = repColors[e.rep] || '#6E6A62';
          chip.style.color = c;
          chip.style.borderColor = tint(c, 0.42);
          chip.title = e.rep;   // full name on hover
          body.appendChild(chip);
        }

        row.appendChild(t);
        row.appendChild(body);
        list.appendChild(row);
      });
      cell.appendChild(list);

      if (entries.length > CELL_LIMIT) {
        const more = document.createElement('div');
        more.className = 'more';
        more.textContent = '+' + (entries.length - CELL_LIMIT) + ' more';
        cell.appendChild(more);
      }

      /* The cell can only hold CELL_LIMIT rows, so the day itself opens a
         sheet listing every sit in full -- otherwise the overflow ones were
         simply unreachable. */
      cell.classList.add('clickable');
      cell.tabIndex = 0;
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-label',
        entries.length + (entries.length === 1 ? ' sit on ' : ' sits on ') +
        MONTHS[cellDate.getMonth()] + ' ' + cellDate.getDate() + ' — open for detail');

      const openThis = () => openDay(cellDate, entries);
      cell.addEventListener('click', ev => {
        // a job link inside the cell should still go straight to AcuLynx
        if (ev.target.closest('a')) return;
        openThis();
      });
      cell.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openThis(); }
      });
    }

    grid.appendChild(cell);
  }

  monthLabel.innerHTML = MONTHS[month] + ' <span class="yr">' + year + '</span>';

  document.getElementById('statTotal').textContent = totalThisMonth;
  document.getElementById('statTotalLabel').textContent = totalThisMonth === 1 ? 'sit' : 'sits';
  document.getElementById('statBusy').textContent =
    busyKey ? (MONTHS[busyKey.getMonth()].slice(0,3) + ' ' + busyKey.getDate() + ' · ' + busyCount) : '—';
  document.getElementById('statReps').textContent = Object.keys(repsThisMonth).length;

  countFooter.textContent = totalThisMonth + ' sit' + (totalThisMonth === 1 ? '' : 's') + ' scheduled this month';
}

/* ── DAY SHEET ───────────────────────────────────────────────────────
   Full detail for one day: every sit, plus the milestone and status that
   the cell can only carry as a tooltip. */
const backdrop = document.getElementById('dayBackdrop');
const sheetBody = document.getElementById('sheetBody');
let lastFocused = null;

function openDay(date, entries){
  lastFocused = document.activeElement;

  document.getElementById('sheetTitle').textContent =
    DAYS[date.getDay()] + ', ' + MONTHS[date.getMonth()] + ' ' + date.getDate();
  document.getElementById('sheetSub').textContent =
    entries.length + (entries.length === 1 ? ' scheduled sit' : ' scheduled sits');

  sheetBody.innerHTML = '';
  entries.forEach(e => {
    const row = document.createElement('div');
    row.className = 'sit';

    const when = document.createElement('div');
    when.className = 'when';
    when.textContent = shortTime(e.time);

    const who = document.createElement('div');
    who.className = 'who';

    const a = document.createElement('a');
    a.href = e.url || '#';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = e.jobName || '(unnamed job)';
    who.appendChild(a);

    const meta = document.createElement('div');
    meta.className = 'meta';

    if (e.rep) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.style.marginLeft = '0';
      chip.textContent = repLabels[e.rep] || e.rep;
      const c = repColors[e.rep] || '#6E6A62';
      chip.style.color = c;
      chip.style.borderColor = tint(c, 0.42);
      chip.title = e.rep;
      meta.appendChild(chip);
    }
    [e.milestone, e.status].filter(Boolean).forEach((txt, i) => {
      if (i > 0 || e.rep) {
        const d = document.createElement('span');
        d.className = 'dot';
        d.textContent = '·';
        meta.appendChild(d);
      }
      const s = document.createElement('span');
      s.textContent = txt;
      meta.appendChild(s);
    });

    if (meta.childNodes.length) who.appendChild(meta);
    row.appendChild(when);
    row.appendChild(who);
    sheetBody.appendChild(row);
  });

  backdrop.hidden = false;
  document.getElementById('sheetClose').focus();
}

function closeDay(){
  backdrop.hidden = true;
  if (lastFocused && lastFocused.focus) lastFocused.focus();
  lastFocused = null;
}

document.getElementById('sheetClose').addEventListener('click', closeDay);
backdrop.addEventListener('click', ev => { if (ev.target === backdrop) closeDay(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !backdrop.hidden) closeDay();
});

function init(appointments, skipped){
  byDate = {};
  appointments.forEach(a => {
    if (!a || !a.date) return;
    if (!byDate[a.date]) byDate[a.date] = [];
    byDate[a.date].push(a);
  });

  // Surface unreadable rows rather than silently dropping appointments
  if (skipped && skipped.length) {
    const note = document.createElement('div');
    note.className = 'status error';
    note.style.padding = '0 0 12px';
    note.textContent = skipped.length + ' row(s) in appointments.csv had an unreadable ' +
      'Scheduled Sit Date and were skipped — ' + skipped.join('; ');
    statusEl.parentNode.insertBefore(note, statusEl);
  }

  repLabels = buildRepLabels(appointments);
  repColors = buildRepColors(Object.keys(repLabels));

  /* Land on the current month when it has sits. Opening on the LAST
     appointment instead would park the calendar on a lone far-out booking --
     the 8/4 export carries one job in November, which would otherwise greet
     everyone with an almost-empty November grid. Falls back to the next month
     that actually has sits, then to the last one on file. */
  const allDates = Object.keys(byDate).sort();
  const now = new Date();
  const monthPrefix = now.getFullYear() + '-' + pad(now.getMonth() + 1);
  const todayKey = monthPrefix + '-' + pad(now.getDate());

  if (!allDates.length || allDates.some(d => d.indexOf(monthPrefix) === 0)) {
    current = new Date(now.getFullYear(), now.getMonth(), 1);
  } else {
    const upcoming = allDates.filter(d => d >= todayKey);
    const target = upcoming.length ? upcoming[0] : allDates[allDates.length - 1];
    const [y, m] = target.split('-').map(Number);
    current = new Date(y, m - 1, 1);
  }

  statusEl.style.display = 'none';
  stripEl.style.display = 'flex';
  calendarWrap.style.display = 'block';
  render();
}

function showError(detail){
  statusEl.className = 'status error';
  statusEl.innerHTML = 'Could not load <strong>appointments.csv</strong>. ' +
    'If you opened this file directly from your computer, browsers block reading the ' +
    'data file &mdash; view it on the portal instead.<br><span style="color:#A7A196;">' +
    String(detail) + '</span>';
}

function step(delta){
  if (!current) return;
  if (!backdrop.hidden) closeDay();   // a sheet for last month must not linger
  current = new Date(current.getFullYear(), current.getMonth() + delta, 1);
  render();
}
document.getElementById('prevBtn').addEventListener('click', () => step(-1));
document.getElementById('nextBtn').addEventListener('click', () => step(1));

fetch('appointments.csv', { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(text => {
    const { appointments, skipped } = rowsToAppointments(parseCSV(text));
    init(appointments, skipped);
  })
  .catch(err => showError(err.message || err));
</script>
