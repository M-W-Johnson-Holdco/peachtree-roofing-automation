<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scheduled Sits Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EF;
    --ink:#232323;
    --line:#D8D3C7;
    --accent:#3F6C9E;      /* acculynx-adjacent blue */
    --vol0:#ECEAE4;
    --vol12:#AFC6A0;       /* sage */
    --vol12-text:#2E4222;
    --vol3:#D99A4E;        /* ochre */
    --vol3-text:#4A2E08;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--paper),var(--paper)),
      repeating-linear-gradient(0deg, rgba(63,108,158,0.035) 0px, rgba(63,108,158,0.035) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, rgba(63,108,158,0.035) 0px, rgba(63,108,158,0.035) 1px, transparent 1px, transparent 28px);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    padding:24px 20px 40px;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  .masthead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:12px;
  }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 4px;
  }
  .masthead h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,3.4vw,36px);
    margin:0;
    line-height:1.05;
    letter-spacing:-0.01em;
  }
  .nav{display:flex;align-items:center;gap:14px;}
  .nav button{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    width:34px;height:34px;
    border-radius:50%;
    cursor:pointer;
    transition:background .15s,color .15s;
  }
  .nav button:hover{background:var(--ink);color:var(--paper);}
  .nav .month-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:.06em;
    min-width:150px;
    text-align:center;
  }

  .legend{
    display:flex;
    gap:18px;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#5b5850;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .legend .swatch{display:inline-flex;align-items:center;gap:6px;}
  .legend .dot{width:10px;height:10px;border-radius:2px;display:inline-block;}

  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
    background:var(--line);
    gap:1px;
  }
  .dow{
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-align:center;
    padding:8px 4px;
  }
  .cell{
    background:var(--vol0);
    min-height:118px;
    padding:8px 8px 10px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .cell.outside{background:var(--paper);}
  .cell.outside .daynum{color:#c9c4b8;}
  .cell.vol-0{background:var(--vol0);}
  .cell.vol-12{background:var(--vol12);}
  .cell.vol-3{background:var(--vol3);}

  .daynum{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:13px;
    color:var(--ink);
  }
  .cell.vol-12 .daynum{color:var(--vol12-text);}
  .cell.vol-3 .daynum{color:var(--vol3-text);}

  .entry{font-size:11.5px;line-height:1.35;display:flex;gap:5px;}
  .entry .t{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#5b5850;
    white-space:nowrap;
    padding-top:1px;
  }
  .cell.vol-12 .entry .t{color:#3b4d31;}
  .cell.vol-3 .entry .t{color:#6b431a;}

  .entry a{
    color:var(--accent);
    text-decoration:none;
    font-weight:500;
    border-bottom:1px solid transparent;
  }
  .entry a:hover{border-bottom-color:var(--accent);}
  .entry a:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px;}

  /* Job name + rep chip share the remaining width so the chip can wrap
     under a long name instead of squeezing it. */
  .entry .body{flex:1;min-width:0;}

  /* Rep chip. Translucent white ground rather than a solid fill so it stays
     legible on all three day shades (cream, sage, ochre); the rep's colour
     carries in the text and border. */
  .chip{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    line-height:1.45;
    letter-spacing:.02em;
    padding:0 4px;
    margin-left:4px;
    border-radius:3px;
    border:1px solid currentColor;
    background:rgba(255,255,255,0.72);
    white-space:nowrap;
    vertical-align:1px;
  }

  .more{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#5b5850;
    margin-top:auto;
  }

  .status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:#5b5850;
    padding:24px 0;
  }
  .status.error{color:#8a2f2f;}
  .status a{color:var(--accent);}

  footer{
    margin-top:22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#9b968a;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  @media (prefers-reduced-motion: reduce){
    .nav button{transition:none;}
  }

  @media (max-width:720px){
    .cell{min-height:96px;padding:6px;}
    .dow{font-size:9px;padding:6px 2px;}
    .entry{font-size:10px;}
    .daynum{font-size:11px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <p class="eyebrow">Peachtree Roofing &amp; Exteriors</p>
      <h1>Scheduled Sits</h1>
    </div>
    <div class="nav">
      <button id="prevBtn" aria-label="Previous month">&#8249;</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextBtn" aria-label="Next month">&#8250;</button>
    </div>
  </div>

  <div class="legend">
    <span class="swatch"><span class="dot" style="background:var(--vol0)"></span>0 sits</span>
    <span class="swatch"><span class="dot" style="background:var(--vol12)"></span>1&ndash;2 sits</span>
    <span class="swatch"><span class="dot" style="background:var(--vol3)"></span>3+ sits</span>
    <span style="margin-left:auto;">Click a name to open the job in AcuLynx</span>
  </div>

  <div class="status" id="status">Loading appointments&hellip;</div>
  <div class="grid" id="calendarGrid" style="display:none;"></div>

  <footer>
    <span id="countFooter"></span>
    <span>Data source: appointments.csv &mdash; drop in a fresh AcuLynx export to refresh</span>
  </footer>

</div>

<script>
/* ============================================================
   Scheduled Sits calendar.

   Reads appointments.csv next to this file -- the AcuLynx "Scheduled Sits"
   export, used exactly as downloaded. To refresh the calendar, replace
   that one file; nothing here needs editing.

   Expected columns (looked up by header name, so column order may change):
     Current Milestone | Job Name | Scheduled Sit Date | Current Status | Job Name Url
   Scheduled Sit Date arrives as a single value like "7/27/26 2:00 PM".
   ============================================================ */

const grid = document.getElementById('calendarGrid');
const monthLabel = document.getElementById('monthLabel');
const countFooter = document.getElementById('countFooter');
const statusEl = document.getElementById('status');

const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let byDate = {};
let current = null;
let repLabels = {};
let repColors = {};

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

/* "9:00 AM" -> 540. Sorting the raw time strings compares the hour digits
   before ever reaching AM/PM, so "02:00 PM" sorts ahead of "12:00 PM" and
   afternoon sits jump above the morning ones. Compare minutes instead. */
function toMinutes(time){
  const m = /^(\d{1,2}):(\d{2})\s*([AaPp])/.exec(String(time).trim());
  if (!m) return 0;
  const hour = (Number(m[1]) % 12) + (m[3].toLowerCase() === 'p' ? 12 : 0);
  return hour * 60 + Number(m[2]);
}

/* ── COMPANY REP CHIPS ───────────────────────────────────────────────
   The export carries full names ("Dan Sinnott"); the chip shows the name
   the team actually uses. Everyone is first-name-only unless listed here.

   Edit these two lists when the roster changes -- nothing else. */

// Reps who go by something other than their first name.
const REP_NICKNAMES = {
  'Kenneth': 'Kenny',
  'Cameron': 'Cam'
};

// First names shared by more than one rep, so the chip always carries a last
// initial ("Tim B", "Tim J"). Listed explicitly rather than detected from the
// data, because a given export may contain only one of them -- Tim J is absent
// from the 8/4 export, and he must still not collide with Tim B tomorrow.
const REP_SHARED_FIRST_NAMES = ['Tim'];

// Dark, distinct hues that stay legible against cream, sage and ochre cells.
const REP_COLORS = [
  '#3F6C9E', '#2E6B4F', '#8A4B2F', '#6B3F7A', '#1F5F6B', '#7A5C2E',
  '#8A2F4F', '#40548A', '#4F6B2E', '#6B4A2F', '#2F5F8A', '#5F3F6B'
];

/* "Dan Sinnott" -> "Dan"; "Kenneth Gutzler" -> "Kenny"; "Tim Bresko" -> "Tim B".
   Falls back to a last initial for any first name that turns out to be shared
   within the loaded data, so a new duplicate is disambiguated automatically
   even before anyone updates REP_SHARED_FIRST_NAMES. */
function buildRepLabels(appointments){
  const names = [];
  appointments.forEach(a => { if (a.rep && names.indexOf(a.rep) === -1) names.push(a.rep); });

  const parsed = {};
  names.forEach(n => {
    const bits = n.split(/\s+/).filter(Boolean);
    const first = bits[0] || n;
    parsed[n] = {
      raw: first,
      display: REP_NICKNAMES[first] || first,
      lastInitial: bits.length > 1 ? bits[bits.length - 1].charAt(0).toUpperCase() : ''
    };
  });

  // Which display names are claimed by more than one person in this export?
  const seen = {};
  names.forEach(n => {
    const d = parsed[n].display;
    seen[d] = (seen[d] || 0) + 1;
  });

  const labels = {};
  names.forEach(n => {
    const p = parsed[n];
    const needsInitial = REP_SHARED_FIRST_NAMES.indexOf(p.raw) !== -1 || seen[p.display] > 1;
    labels[n] = (needsInitial && p.lastInitial) ? p.display + ' ' + p.lastInitial : p.display;
  });
  return labels;
}

/* One colour per rep, assigned without anyone maintaining a list.

   The hue starts from a hash of the name so a given rep keeps the same colour
   from export to export, then probes forward to the next free slot -- hashing
   alone collided three times across eleven reps, which defeats the point of
   colouring them. Reps beyond REP_COLORS.length will start to share hues. */
function buildRepColors(names){
  const used = {};
  const out = {};
  names.slice().sort().forEach(name => {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    let idx = h % REP_COLORS.length;
    for (let k = 0; k < REP_COLORS.length; k++) {
      const cand = (idx + k) % REP_COLORS.length;
      if (!used[cand]) { idx = cand; break; }
    }
    used[idx] = true;
    out[name] = REP_COLORS[idx];
  });
  return out;
}

/* Minimal CSV reader: handles quoted fields, embedded commas and newlines,
   and "" escapes -- a job name like "Smith, John" must not split a row. */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\n') {
      row.push(field); rows.push(row); row = []; field = '';
    } else if (c !== '\r') {
      field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }

  // Drop trailing blank lines the export leaves behind
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

/* "7/27/26 2:00 PM" -> { date: "2026-07-27", time: "02:00 PM" }.
   Hours are zero-padded so the time column lines up in the day cells. */
function parseSitDateTime(raw){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(\d{1,2}):(\d{2})\s*([AaPp])[Mm]?\.?$/.exec(String(raw).trim());
  if (!m) return null;
  let year = Number(m[3]);
  if (year < 100) year += 2000;
  return {
    date: year + '-' + pad(Number(m[1])) + '-' + pad(Number(m[2])),
    time: pad(Number(m[4])) + ':' + m[5] + ' ' + m[6].toUpperCase() + 'M'
  };
}

/* Map the AcuLynx export rows onto the records the calendar renders.
   Columns are located by header name so a reordered export still works. */
function rowsToAppointments(rows){
  if (!rows.length) throw new Error('appointments.csv is empty');

  const header = rows[0].map(h => h.trim().toLowerCase());
  const col = name => header.indexOf(name);
  const iDate = col('scheduled sit date');
  const iName = col('job name');
  const iUrl  = col('job name url');
  const iMile = col('current milestone');
  const iStat = col('current status');
  const iRep  = col('company representative');  // added Aug 2026; older exports lack it

  if (iDate === -1 || iName === -1) {
    throw new Error('appointments.csv is missing a "Scheduled Sit Date" or "Job Name" column');
  }

  const appointments = [];
  const skipped = [];

  rows.slice(1).forEach((r, idx) => {
    const when = parseSitDateTime(r[iDate] || '');
    if (!when) {
      skipped.push('row ' + (idx + 2) + ': ' + (r[iDate] || '(blank date)'));
      return;
    }
    appointments.push({
      date: when.date,
      time: when.time,
      jobName: (r[iName] || '').trim(),
      milestone: iMile === -1 ? '' : (r[iMile] || '').trim(),
      status: iStat === -1 ? '' : (r[iStat] || '').trim(),
      rep: iRep === -1 ? '' : (r[iRep] || '').trim(),
      url: iUrl === -1 ? '' : (r[iUrl] || '').trim()
    });
  });

  return { appointments, skipped };
}

function render(){
  grid.innerHTML = '';
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d.slice(0,3);
    grid.appendChild(el);
  });

  const year = current.getFullYear();
  const month = current.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay();
  const gridStart = new Date(year, month, 1 - startOffset);

  let totalThisMonth = 0;

  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate() + i);
    const key = toKey(cellDate);
    const inMonth = cellDate.getMonth() === month;
    const entries = (byDate[key] || []).slice().sort((a,b) => toMinutes(a.time) - toMinutes(b.time));

    const cell = document.createElement('div');
    let volClass = 'vol-0';
    if (entries.length >= 3) volClass = 'vol-3';
    else if (entries.length >= 1) volClass = 'vol-12';
    cell.className = 'cell ' + (inMonth ? volClass : 'outside');

    const num = document.createElement('div');
    num.className = 'daynum';
    num.textContent = cellDate.getDate();
    cell.appendChild(num);

    if (inMonth) {
      totalThisMonth += entries.length;
      entries.slice(0, 4).forEach(e => {
        const row = document.createElement('div');
        row.className = 'entry';
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = String(e.time || '').replace(' ', '');
        const body = document.createElement('span');
        body.className = 'body';

        const a = document.createElement('a');
        a.href = e.url || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = e.jobName || '(unnamed job)';
        a.title = [e.milestone, e.status].filter(Boolean).join(' — ');
        body.appendChild(a);

        if (e.rep) {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = repLabels[e.rep] || e.rep;
          chip.style.color = repColors[e.rep] || '#5b5850';
          chip.title = e.rep;   // full name on hover
          body.appendChild(chip);
        }

        row.appendChild(t);
        row.appendChild(body);
        cell.appendChild(row);
      });
      if (entries.length > 4) {
        const more = document.createElement('div');
        more.className = 'more';
        more.textContent = '+' + (entries.length - 4) + ' more';
        cell.appendChild(more);
      }
    }

    grid.appendChild(cell);
  }

  monthLabel.textContent = MONTHS[month] + ' ' + year;
  countFooter.textContent = totalThisMonth + ' sit' + (totalThisMonth === 1 ? '' : 's') + ' scheduled this month';
}

function init(appointments, skipped){
  byDate = {};
  appointments.forEach(a => {
    if (!a || !a.date) return;
    if (!byDate[a.date]) byDate[a.date] = [];
    byDate[a.date].push(a);
  });

  // Surface unreadable rows rather than silently dropping appointments
  if (skipped && skipped.length) {
    const note = document.createElement('div');
    note.className = 'status error';
    note.style.padding = '0 0 12px';
    note.textContent = skipped.length + ' row(s) in appointments.csv had an unreadable ' +
      'Scheduled Sit Date and were skipped — ' + skipped.join('; ');
    statusEl.parentNode.insertBefore(note, statusEl);
  }

  repLabels = buildRepLabels(appointments);
  repColors = buildRepColors(Object.keys(repLabels));

  /* Land on the current month when it has sits. Opening on the LAST
     appointment instead would park the calendar on a lone far-out booking --
     the 8/4 export carries one job in November, which would otherwise greet
     everyone with an almost-empty November grid. Falls back to the next month
     that actually has sits, then to the last one on file. */
  const allDates = Object.keys(byDate).sort();
  const now = new Date();
  const monthPrefix = now.getFullYear() + '-' + pad(now.getMonth() + 1);
  const todayKey = monthPrefix + '-' + pad(now.getDate());

  if (!allDates.length || allDates.some(d => d.indexOf(monthPrefix) === 0)) {
    current = new Date(now.getFullYear(), now.getMonth(), 1);
  } else {
    const upcoming = allDates.filter(d => d >= todayKey);
    const target = upcoming.length ? upcoming[0] : allDates[allDates.length - 1];
    const [y, m] = target.split('-').map(Number);
    current = new Date(y, m - 1, 1);
  }

  statusEl.style.display = 'none';
  grid.style.display = 'grid';
  render();
}

function showError(detail){
  statusEl.className = 'status error';
  statusEl.innerHTML = 'Could not load <strong>appointments.csv</strong>. ' +
    'If you opened this file directly from your computer, browsers block reading the ' +
    'data file &mdash; view it on the portal instead.<br><span style="color:#9b968a;">' +
    String(detail) + '</span>';
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if (!current) return;
  current = new Date(current.getFullYear(), current.getMonth() - 1, 1);
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (!current) return;
  current = new Date(current.getFullYear(), current.getMonth() + 1, 1);
  render();
});

fetch('appointments.csv', { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(text => {
    const { appointments, skipped } = rowsToAppointments(parseCSV(text));
    init(appointments, skipped);
  })
  .catch(err => showError(err.message || err));
</script>
</body>
</html>
